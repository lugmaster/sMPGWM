type: object
additionalProperties: false
required:
  - id
  - name
  - tier
  - active
  - mass
  - description
  - hardpoints
  - stats
properties:
  id:
    type: string
    minLength: 1
  name:
    type: string
    minLength: 1
  tier:
    type: integer
    minimum: 1
  active:
    type: boolean
  mass:
    type: number
    exclusiveMinimum: 0
  description:
    type:
      - string
      - "null"
  hardpoints:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - slot
        - type
        - optional
      properties:
        slot:
          type: string
        type:
          type: string
        optional:
          type: boolean
  stats:
    type: object
    additionalProperties:
      type: integer
