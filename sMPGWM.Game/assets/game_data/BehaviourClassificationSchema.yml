$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Version
  - BehaviourClassifications
properties:
  Version:
    type: string
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+(?![\s\S])
  BehaviourClassifications:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
        - Description
      properties:
        Id:
          type: string
          pattern: ^[a-z][A-Za-z0-9_]*(?![\s\S])
        DisplayName:
          type: string
          minLength: 1
          pattern: \S
        Description:
          type: string
          minLength: 1
          pattern: \S
    minItems: 1
