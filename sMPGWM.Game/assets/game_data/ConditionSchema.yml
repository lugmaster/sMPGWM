$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Version
  - Conditions
properties:
  Version:
    type: string
    minLength: 1
  Conditions:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
        - Description
      properties:
        Id:
          type: string
          pattern: ^[a-z][A-Za-z0-9_]*$
        DisplayName:
          type: string
          minLength: 1
        Description:
          type: string
          minLength: 1
    minItems: 1
