$schema: http://json-schema.org/draft-07/schema#
title: Ship definitions
type: object
additionalProperties: false
required:
  - Version
  - ships
properties:
  Version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  ships:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - texture_path
        - collider_points
        - mass
        - health
        - stat_modifiers
        - weapon_slots
      properties:
        name:
          type: string
          pattern: '\S'
        texture_path:
          type: string
          pattern: '^res://.+'
        collider_points:
          type: array
          minItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        mass:
          type: number
          minimum: 0
          maximum: 3.4028234663852886e+38
        health:
          description: Ship-defined maximum health, independent of installed equipment.
          type: number
          exclusiveMinimum: 0
        stat_modifiers:
          description: Flat adjustments to installed equipment; omitted fields are zero. Legacy ship_stats and ShieldCurrent are no longer supported.
          type: object
          additionalProperties: false
          properties:
            ShieldCapacity:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            Speed:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            AfterBurnerSpeed:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            RotationSpeed:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            Acceleration:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            AfterBurnerAcceleration:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            Armor:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            RechargeTime:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            DownTime:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            EnergyProduction:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
            EnergyStorage:
              type: number
              minimum: -3.4028234663852886e+38
              maximum: 3.4028234663852886e+38
        weapon_slots:
          type: object
          additionalProperties: false
          required:
            - light
            - heavy
          properties:
            light:
              type: integer
              minimum: 0
            heavy:
              type: integer
              minimum: 0
