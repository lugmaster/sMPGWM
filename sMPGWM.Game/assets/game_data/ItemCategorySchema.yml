$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Version
  - Categories
properties:
  Version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  Categories:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
      not:
        required: [CanStack, StackLimit]
      properties:
        Id:
          type: string
          pattern: '\S'
        DisplayName:
          type: string
          pattern: '\S'
        Icon:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]*\.[A-Za-z][A-Za-z0-9_]*$'
        Description:
          type: string
        CanStack:
          type: boolean
        StackLimit:
          type: integer
          minimum: 2
          maximum: 2147483646
