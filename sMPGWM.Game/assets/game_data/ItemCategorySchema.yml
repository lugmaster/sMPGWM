$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Categories
properties:
  Categories:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
        - DisplayOrder
        - CanStack
      properties:
        Id:
          type: string
          pattern: '\S'
        DisplayName:
          type: string
          pattern: '\S'
        DisplayOrder:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        CanStack:
          type: boolean
        IconAssetPath:
          type: [string, 'null']
        Icon:
          type: [string, 'null']
          pattern: '^[A-Za-z][A-Za-z0-9_]*\.[A-Za-z][A-Za-z0-9_]*$'
