$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Categories
properties:
  Categories:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
        - Icon
      properties:
        Id:
          type: string
          pattern: '\S'
        DisplayName:
          type: string
          pattern: '\S'
        Icon:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]*\.[A-Za-z][A-Za-z0-9_]*$'
