$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required: [Version, AbilityLoadoutDefinitions]
properties:
  Version:
    type: string
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
  AbilityLoadoutDefinitions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [Id, DisplayName, Description, AbilityIds]
      properties:
        Id:
          type: string
          pattern: ^[a-z][A-Za-z0-9_]*$
        DisplayName:
          type: string
          minLength: 1
        Description:
          type: string
          minLength: 1
        AbilityIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9_]*$
