EffectDefinitionSchema:
  Type: object
  Required:
    - Definition
  Fields:
    Definition:
      Type: object
      Required:
        - EffectDefinitionId
        - Name
        - Description
      Fields:
        EffectDefinitionId:
          Type: string
          Nullable: false
          Example: effect.raise.heal
        Name:
          Type: string
          Nullable: false
        Description:
          Type: string
          Nullable: false
    EffectType:
      Type: enum
      ValuesRef: EffectType
      Default: Active
    EffectProcessing:
      Type: enum
      ValuesRef: EffectProcessing
      Default: Fast
    Trigger:
      Type: object
      Nullable: true
      Default:
        TriggerType: Immediate
      Required:
        - TriggerType
      Fields:
        TriggerType:
          Type: enum
          ValuesRef: TriggerType
          Default: Immediate
        TickIntervalMs:
          Type: float
          Default: 0.0
          Nullable: true
          OnlyWithTriggerType: OverTime
        TriggerConditions:
          Type: array
          ItemsRef: TriggerCondition
          Nullable: true
          Default: [ ]
      Rules:
        - If TriggerType is OverTime, TickIntervalMs is required and must be greater than 100.
        - If TriggerType is not OverTime, TickIntervalMs is ignored and should be omitted from canonical definitions.
        - OverTimeConstant does not execute repeatedly every engine tick. It contributes a persistent active modifier or active
          condition/classification while the ActiveEffect exists.
        - OnExpire requires Duration.DurationType = Temporary.
        - OnRemoval requires Duration.DurationType = Permanent or Temporary and is triggered by explicit removal, not natural
          expiry.
    Duration:
      Type: object
      Required:
        - DurationType
      Fields:
        DurationType:
          Type: enum
          ValuesRef: DurationType
          Default: Once
        DurationMS:
          Type: float
          Default: 0.0
          Nullable: true
      Rules:
        - If DurationType is Temporary, DurationMS is required and must be greater than 100.
        - If DurationType is not Temporary, DurationMS is ignored and should be omitted from canonical definitions.
        - Runtime duration is converted to NetworkTick values; simulation must not use wall-clock duration at runtime.
    Target:
      Type: object
      Nullable: true
      Required:
        - TargetStat
        - TargetValueKind
        - Manipulation
        - Calculation
        - Value
      Fields:
        TargetStat:
          Type: Stat
          Nullable: false
        TargetValueKind:
          Type: enum
          ValuesRef: TargetValueKind
        Manipulation:
          Type: enum
          ValuesRef: Manipulation
        Calculation:
          Type: enum
          ValuesRef: Calculation
        Value:
          Type: float
      Rules:
        - Each effect may have at most one Target.
        - Calculation Percentage values are decimal fractions; 0.05 means 5 percent.
        - ResourcePool Current is valid only for transactional changes such as damage, heal, drain, regeneration, or consumption.
          Persistent ResourcePool buffs/debuffs must target Max.
        - Attribute Current is the effective runtime value and may be modified by temporary non-passive effects. Attribute Current
          is recalculated from active modifiers and snaps back to Max when those modifiers expire or are removed.
        - Attribute Max is the passive/base/equipment-adjusted baseline and should be recalculated only when passive/permanent/source
          state changes.
    ConditionAndClassificationRequests:
      Type: object
      Nullable: true
      Fields:
        ConditionsAddRequest:
          Type: array
          Items: Condition
          Nullable: true
        ConditionsRemoveRequest:
          Type: array
          Items: Condition
          Nullable: true
        ClassificationsAddRequest:
          Type: array
          Items: EffectClassification
          Nullable: true
      Rules:
        - If present, at least one contained array must contain at least one value.
        - ConditionsAddRequest and ConditionsRemoveRequest target LivingEntityState conditions.
        - For OverTimeConstant Temporary/Permanent effects, ConditionsAddRequest represents an active condition contribution
          while the ActiveEffect exists; the condition remains if another active effect still contributes it.
        - ClassificationsAddRequest attaches classifications to the ActiveEffect metadata only. It does not mutate LivingEntityState.
        - ClassificationsRemoveRequest is not valid; classifications disappear when the ActiveEffect expires or is removed.
    Blocking:
      Type: object
      Nullable: true
      Fields:
        BlockPolicy:
          Type: enum
          ValuesRef: BlockPolicy
          Default: RemoveOnFail
        BlockedByCondition:
          Type: array
          Items: Condition
          Nullable: true
        BlockedByClassification:
          Type: array
          Items: EffectClassification
          Nullable: true
      Rules:
        - BlockedByCondition checks conditions on the target LivingEntityState.
        - BlockedByClassification checks classifications attached to active effects on the target.
        - Dead blocks by default unless CanTriggerWhileDead is true.
        - Blocking is evaluated before trigger and trigger conditions.
        - RemoveOnFail consumes/removes the effect when blocked. Retry keeps the effect active until its next due execution,
          natural expiry, or explicit removal.
    EffectRemovalRequest:
      Type: object
      Nullable: true
      Fields:
        EffectRuntimeIds:
          Type: array
          Items: EffectRuntimeId
          Nullable: true
        EffectDefinitionIds:
          Type: array
          Items: EffectDefinitionId
          Nullable: true
        SourceIds:
          Type: array
          Items: SourceId
          Nullable: true
        OriginIds:
          Type: array
          Items: OriginId
          Nullable: true
        Classifications:
          Type: array
          Items: EffectClassification
          Nullable: true
        Conditions:
          Type: array
          Items: Condition
          Nullable: true
        EffectsTargetingStats:
          Type: array
          Items: Stat
          Nullable: true
        StackGroupIds:
          Type: array
          Items: StackGroupId
          Nullable: true
        EffectRemovalBehaviour:
          Type: object
          Nullable: true
          Fields:
            MaxRemoveCount:
              Type: int
              Default: 1
            RemoveOldestFirst:
              Type: bool
              Default: true
      Rules:
        - If present, at least one selector array must contain at least one value.
        - Selectors are combined with AND between fields and OR within each field list.
        - If EffectRemovalBehaviour is omitted, all matching active effects are requested for removal.
        - Passive effects can only be removed by EffectRuntimeIds.
        - 'Removal ordering is deterministic: RemoveOldestFirst, AppliedNetworkTick, InsertionSequence, EffectRuntimeId.'
    EffectRemovalPolicy:
      Type: enum
      ValuesRef: EffectRemovalPolicy
      Default: ByAnySource
    CanTriggerWhileDead:
      Type: bool
      Default: false
    Stacking:
      Type: object
      Nullable: true
      Fields:
        StackGroupId:
          Type: int
          Nullable: true
        StackScope:
          Type: enum
          ValuesRef: StackScope
          Default: ByEffectDefinitionId
        StackPolicy:
          Type: enum
          ValuesRef: StackPolicy
          Default: Stack
        StackBehavior:
          Type: enum
          ValuesRef: StackBehavior
          Default: IndependentStacks
        MaxStacks:
          Type: int
          Nullable: true
        MaxStackOverflowPolicy:
          Type: enum
          ValuesRef: MaxStackOverflowPolicy
          Default: ReplaceOldest
          Nullable: true
      Rules:
        - StackScope ByStackGroupId requires StackGroupId.
        - MaxStacks is the canonical stack limit field. MaxStacksToOverflow and LimitStacks are invalid.
        - If StackPolicy is Stack and MaxStacks is set, MaxStacks must be greater than 0.
        - When MaxStacks is reached, use MaxStackOverflowPolicy. Default is ReplaceOldest.
    Visibility:
      Type: enum
      ValuesRef: Visibility
      Default: Internal
    ChildEffectDefinitions:
      Type: array
      ItemsRef: ChildEffectDefinition
      Nullable: true
      Rules:
        - Child effects are processed in deterministic list order.
    IsEffectContainer:
      Type: bool
      Default: false
  Rules:
    - An effect is valid if IsEffectContainer is false and at least one of Target, ConditionAndClassificationRequests, EffectRemovalRequest,
      or ChildEffectDefinitions is present.
    - A container is valid if IsEffectContainer is true, Target is omitted, ConditionAndClassificationRequests is omitted, and
      ChildEffectDefinitions is present with at least one entry.
    - EffectDefinitions are validated once at startup. An EffectDefinition is valid only if all referenced child definitions
      are valid and the child graph is acyclic.
ReusableSchemas:
  TriggerCondition:
    Type: object
    Required:
      - Type
    Fields:
      Type:
        Type: enum
        ValuesRef: TriggerConditionType
      Conditions:
        Type: array
        Items: Condition
        Nullable: true
      Classifications:
        Type: array
        Items: EffectClassification
        Nullable: true
      Operator:
        Type: enum
        ValuesRef: ConditionOperator
        Default: Any
      Stat:
        Type: Stat
        Nullable: true
      TargetValueKind:
        Type: enum
        ValuesRef: TargetValueKind
        Nullable: true
      ThresholdPercent:
        Type: float
        Nullable: true
    Rules:
      - OnConditionsPresent and OnConditionsMissing require Conditions.
      - OnClassificationsPresent and OnClassificationsMissing require Classifications.
      - OnStatRaised and OnStatReduced require Stat and TargetValueKind and trigger from validated StatModificationRecords.
      - OnStatValueBelow and OnStatValueAbove require Stat and ThresholdPercent and evaluate after final stat resolution.
  ChildEffectDefinition:
    Type: object
    Required:
      - ChildEffectDefinitionId
    Fields:
      ChildEffectDefinitionId:
        Type: EffectDefinitionId
      ChildEffectTrigger:
        Type: enum
        ValuesRef: ChildEffectTrigger
        Default: BoundToParent
    Rules:
      - BoundToParent creates the child when the parent triggers and removes/expires the child with the parent.
      - OnParentExpired creates an independent child only when the parent expires naturally.
      - OnParentRemoved creates an independent child only when the parent is explicitly removed before natural expiry.
      - OnParentExpiredOrRemoved creates an independent child when the parent either expires naturally or is explicitly removed.
EffectRuntimeSchema:
  Type: object
  Required:
    - EffectRuntimeId
    - EffectDefinitionId
    - SourceId
    - OriginId
    - TargetEntityId
    - AppliedNetworkTick
  Fields:
    EffectRuntimeId:
      Type: id
    EffectType:
      Type: enum
      ValuesRef: EffectType
      Readonly: true
    EffectProcessing:
      Type: enum
      ValuesRef: EffectProcessing
      Readonly: true
    EffectDefinitionId:
      Type: EffectDefinitionId
      Readonly: true
    SourceId:
      Type: SourceId
      Readonly: true
    OriginId:
      Type: OriginId
      Readonly: true
    TargetEntityId:
      Type: EntityId
      Readonly: true
    AppliedNetworkTick:
      Type: long
    LastExecutedNetworkTick:
      Type: long
      Default: -1
    LastTriggeredNetworkTick:
      Type: long
      Default: -1
    ExpiresNetworkTick:
      Type: long
      Nullable: true
    StackCount:
      Type: int
      Default: 1
    ParentEffectRuntimeId:
      Type: id
      Nullable: true
    ChildDepth:
      Type: int
      Default: 0
    RuntimeFlags:
      Type: flags
      Nullable: true
