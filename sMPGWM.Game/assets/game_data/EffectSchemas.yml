SchemaVersion: 6.3.0
SchemaKind: FLU.RPG.StateEngine.Effects
SourcePrecedence:
  - TagSystem.md version 1.1.0
  - FLU_RPG_StateEngine_PRD.md version 6.3.0
  - effects_622.md source base
  - lifecycle_based_conditions_100.md version 1.0.0 condition lifecycle proposal
  - EffectSchemas.yml and EffectDefinitions.yml source YAML
  - 'Clarification answers: hard replacement, contributor-owned conditions, top-level EffectClassifications, RemoveMode support, canonical Gameplay Tag references'
DecisionsApplied:
  - Passive effects are removed from the Effects model. Passives are handled by a separate passive modifier pipeline.
  - EffectType is removed. All definitions in this schema are ActiveEffect definitions.
  - DurationType Permanent is renamed to UntilRemoved for active effects that persist until explicit removal.
  - TriggerType OverTimeConstant is renamed to WhileActive.
  - TargetValueKind values are CurrentValue and CurrentMaxValue.
  - CurrentMaxValue is valid only for PoolStats.
  - WhileActive must not target CurrentValue of a PoolStat.
  - AttributeStats and FlowStats may only be actively modified through WhileActive + CurrentValue + ApplicationMode WhileActive.
  - Immediate, OnExpire, and OnRemoval stat targets are restricted to PoolStat.CurrentValue + ApplicationMode Instant.
  - OverTime stat targets are restricted to PoolStat.CurrentValue + ApplicationMode Instant or PoolStat.CurrentMaxValue + ApplicationMode AccumulateWhileActive.
  - ApplicationMode is optional and may be explicit when valid. Defaults are inferred deterministically from trigger, stat category, and target value kind.
  - AccumulateWhileActive contribution is runtime state on ActiveEffect. It is not mutable EffectDefinition data.
  - Refreshing an AccumulateWhileActive effect preserves accumulated value. Replacing it removes the old accumulator and starts fresh.
  - IndependentStacks with AccumulateWhileActive creates one independent accumulator per accepted ActiveEffect.
  - Calculation Percentage values are decimal fractions. Active modifier percentages use the passive baseline; Instant PoolStat.CurrentValue percentages use CurrentMaxValue at execution time.
  - AccumulateWhileActive percentage reductions are capped at -100 percent contribution. Raises have no dedicated schema cap in the first implementation.
  - FlowStat target Value is authored in the stat's canonical per-ms unit where applicable.
  - PoolStat.CurrentValue clamps after each individual CurrentValue modification record.
  - PoolStat.CurrentMaxValue may use unclamped intermediate values during resolution but is clamped at the end of capacity resolution.
  - Positive pool capacity compensation is based only on positive capacity delta gained this tick above EffectiveMaxValue.
  - Removing a capacity debuff back toward EffectiveMaxValue does not raise CurrentValue.
  - ConditionAndClassificationRequests is removed and invalid in 6.3.0. There is no migration compatibility layer.
  - EffectClassifications is a top-level static metadata field on EffectDefinition and is attached to the ActiveEffect after stack policy resolution accepts a runtime instance.
  - Classifications are not LivingEntityState conditions and are never lifecycle-added or lifecycle-removed. They disappear automatically when the ActiveEffect is removed.
  - ConditionRequests is a lifecycle-timed list. Supported timings are OnFirstApplication, OnFirstExecution, OnExpire, OnRemove, and OnExpireOrRemove.
  - Condition contributions are owned by EffectRuntimeId internally. LivingEntityState exposes aggregated EntityCondition tag presence, while the StateEngine tracks contributors behind each condition.
  - ConditionRequests may contain both ConditionsAddRequest and ConditionsRemoveRequest in one entry. Each entry requires at least one non-empty operation array.
  - ConditionsRemoveRequest supports RemoveMode. RemoveOwnContribution removes only the current ActiveEffect contribution; RemoveAllContributions clears the condition from the target.
  - 'RemoveMode defaults are lifecycle-aware: application/execution removals default to RemoveAllContributions; expiry/removal cleanup defaults to RemoveOwnContribution.'
  - Canonical definitions should declare ConditionRequest Timing explicitly. Importers may infer default timing from TriggerType only when authoring data intentionally omits Timing.
  - Conditions and EffectClassifications are Gameplay Tag references governed by TagSystem.md.
  - Canonical effect data stores fully qualified tag names such as Condition.Dead and Effect.Damage.Poison.Dot.
  - Short condition or classification names are importer migration inputs only and must be canonicalized before validation.
  - Parent/category tags must be explicitly defined in the Gameplay Tag registry before child tags can be used.
  - Direct assignment fields require assignable tags. In canonical authoring, direct effect classifications and condition add/remove requests use leaf tags.
  - Parent/category tags are used by selector/query fields such as blocking, trigger conditions, and effect removal requests, and match through expanded tag masks.
