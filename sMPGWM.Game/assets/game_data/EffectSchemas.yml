EffectDefinitionSchema:
  Type: object
  Required:
    - Definition
  Fields:
    Definition:
      Type: object
      Required:
        - EffectDefinitionId
        - Name
        - Description
      Fields:
        EffectDefinitionId:
          Type: string
          Nullable: false
          Example: effect.raise.heal
        Name:
          Type: string
          Nullable: false
        Description:
          Type: string
          Nullable: false
    EffectProcessing:
      Type: enum
      ValuesRef: EffectProcessing
      Default: Fast
    Trigger:
      Type: object
      Nullable: true
      Default:
        TriggerType: Immediate
      Required:
        - TriggerType
      Fields:
        TriggerType:
          Type: enum
          ValuesRef: TriggerType
          Default: Immediate
        TickIntervalMs:
          Type: float
          Default: 0.0
          Nullable: true
          OnlyWithTriggerType: OverTime
        TriggerConditions:
          Type: array
          ItemsRef: TriggerCondition
          Nullable: true
          Default: []
      Rules:
        - If TriggerType is OverTime, TickIntervalMs is required and must be greater than 100.
        - If TriggerType is not OverTime, TickIntervalMs is ignored and should be omitted from canonical definitions.
        - WhileActive contributes active modifiers, conditions, or classifications while the ActiveEffect exists. It does not tick.
        - OnExpire requires Duration.DurationType = Temporary.
        - OnRemoval requires Duration.DurationType = Temporary or UntilRemoved and is triggered by explicit removal, not natural expiry.
    Duration:
      Type: object
      Required:
        - DurationType
      Fields:
        DurationType:
          Type: enum
          ValuesRef: DurationType
          Default: Once
        DurationMS:
          Type: float
          Default: 0.0
          Nullable: true
      Rules:
        - If DurationType is Temporary, DurationMS is required and must be greater than 100.
        - If DurationType is Once or UntilRemoved, DurationMS should be omitted from canonical definitions.
        - Runtime duration is converted to NetworkTick values; simulation must not use wall-clock duration at runtime.
        - UntilRemoved is an active effect lifetime, not passive behavior.
    EffectClassifications:
      Type: array
      Items: EffectClassification
      Nullable: true
      Default: []
      Rules:
        - EffectClassifications is static metadata attached to the ActiveEffect after stack policy resolution accepts the runtime instance.
        - EffectClassifications is not added to LivingEntityState and is not controlled by ConditionRequests.
        - Classifications are used by blocking, removal matching, trigger checks, UI/debug identity, and inspection.
        - Classifications disappear automatically when the ActiveEffect expires or is removed.
        - Values must be fully qualified EffectClassification gameplay tags.
        - Values must be assignable direct tags. Parent/category tags are reserved for selector and query fields.
    ConditionRequests:
      Type: array
      ItemsRef: ConditionRequest
      Nullable: true
      Default: []
      Rules:
        - ConditionRequests mutate target LivingEntityState conditions through the StateEngine at explicit ActiveEffect lifecycle timings.
        - Each ConditionRequest requires Timing in canonical 6.3.0 definitions. Importers may infer Timing only when authoring data intentionally omits it.
        - Each ConditionRequest must contain at least one non-empty ConditionsAddRequest or ConditionsRemoveRequest array. Both arrays may be present in one entry.
        - OnFirstApplication fires only after stack policy resolution and only for an accepted runtime ActiveEffect instance.
        - OnFirstExecution fires at most once per runtime instance, only after the first successful execution. Blocked attempts do not fire it.
        - OnExpire fires only on natural duration expiry. OnRemove fires only on explicit removal. OnExpireOrRemove fires in both cases.
        - Lifecycle-owned cleanup should use OnExpireOrRemove with RemoveOwnContribution.
        - Conditions are contributor-owned internally by EffectRuntimeId; the public LivingEntityState EntityCondition tag remains present while at least one contributor remains.
        - ConditionsAddRequest and ConditionsRemoveRequest values must be fully qualified, assignable EntityCondition gameplay tags.
    Target:
      Type: object
      Nullable: true
      Required:
        - TargetStat
        - TargetValueKind
        - Manipulation
        - Calculation
        - Value
      Fields:
        TargetStat:
          Type: Stat
          Nullable: false
        TargetValueKind:
          Type: enum
          ValuesRef: TargetValueKind
        Manipulation:
          Type: enum
          ValuesRef: Manipulation
        Calculation:
          Type: enum
          ValuesRef: Calculation
        Value:
          Type: float
        ApplicationMode:
          Type: enum
          ValuesRef: ApplicationMode
          Nullable: true
      Rules:
        - Each effect may have at most one Target.
        - TargetValueKind must be CurrentValue or CurrentMaxValue.
        - Active effects must not target BaseValue or EffectiveMaxValue.
        - ApplicationMode is optional. If omitted, it is inferred from ApplicationModeDefaults.
        - Explicit ApplicationMode is allowed only when the combination exists in ValidTargetCombinations.
        - CurrentMaxValue is valid only for PoolStats.
        - WhileActive must not target CurrentValue of a PoolStat.
        - AttributeStats and FlowStats may only use WhileActive + CurrentValue + ApplicationMode WhileActive.
        - Immediate, OnExpire, and OnRemoval stat targets may only use PoolStat.CurrentValue + ApplicationMode Instant.
        - OverTime stat targets may only use PoolStat.CurrentValue + ApplicationMode Instant or PoolStat.CurrentMaxValue + ApplicationMode AccumulateWhileActive.
        - Calculation Percentage values are decimal fractions; 0.05 means 5 percent.
        - Active modifier percentages use the passive baseline as reference.
        - Instant PoolStat.CurrentValue Percentage uses the pool CurrentMaxValue at execution time.
        - AccumulateWhileActive Percentage Reduce contributions are capped at -100 percent.
        - FlowStat Value is authored in the stat's canonical per-ms unit where applicable.
    Blocking:
      Type: object
      Nullable: true
      Fields:
        BlockPolicy:
          Type: enum
          ValuesRef: BlockPolicy
          Default: RemoveOnFail
        BlockedByCondition:
          Type: array
          Items: Condition
          Nullable: true
        BlockedByClassification:
          Type: array
          Items: EffectClassification
          Nullable: true
      Rules:
        - BlockedByCondition checks conditions on the target LivingEntityState using EntityCondition gameplay tags.
        - BlockedByClassification checks classifications attached to active effects on the target using EffectClassification gameplay tags.
        - Blocking selectors may use parent/category tags and match expanded tag masks.
        - Condition.Dead blocks by default unless CanTriggerWhileDead is true.
        - Blocking is evaluated before trigger and trigger conditions.
        - RemoveOnFail consumes/removes the effect when blocked. Retry keeps the effect active until its next due execution, natural expiry, or explicit removal.
    EffectRemovalRequest:
      Type: object
      Nullable: true
      Fields:
        EffectRuntimeIds:
          Type: array
          Items: EffectRuntimeId
          Nullable: true
        EffectDefinitionIds:
          Type: array
          Items: EffectDefinitionId
          Nullable: true
        SourceIds:
          Type: array
          Items: SourceId
          Nullable: true
        OriginIds:
          Type: array
          Items: OriginId
          Nullable: true
        Classifications:
          Type: array
          Items: EffectClassification
          Nullable: true
        Conditions:
          Type: array
          Items: Condition
          Nullable: true
        EffectsTargetingStats:
          Type: array
          Items: Stat
          Nullable: true
        StackGroupIds:
          Type: array
          Items: StackGroupId
          Nullable: true
        EffectRemovalBehaviour:
          Type: object
          Nullable: true
          Fields:
            MaxRemoveCount:
              Type: int
              Default: 1
            RemoveOldestFirst:
              Type: bool
              Default: true
      Rules:
        - If present, at least one selector array must contain at least one value.
        - Selectors are combined with AND between fields and OR within each field list.
        - Conditions and Classifications selectors use canonical gameplay tags and may reference parent/category tags for broad matching.
        - If EffectRemovalBehaviour is omitted, all matching active effects are requested for removal.
        - Passives are not effects and cannot be removed through EffectRemovalRequest.
        - Removal ordering is deterministic: RemoveOldestFirst, AppliedNetworkTick, InsertionSequence, EffectRuntimeId.
    EffectRemovalPolicy:
      Type: enum
      ValuesRef: EffectRemovalPolicy
      Default: ByAnySource
    CanTriggerWhileDead:
      Type: bool
      Default: false
    Stacking:
      Type: object
      Nullable: true
      Fields:
        StackGroupId:
          Type: int
          Nullable: true
        StackScope:
          Type: enum
          ValuesRef: StackScope
          Default: ByEffectDefinitionId
        StackPolicy:
          Type: enum
          ValuesRef: StackPolicy
          Default: Stack
        StackBehavior:
          Type: enum
          ValuesRef: StackBehavior
          Default: IndependentStacks
        MaxStacks:
          Type: int
          Nullable: true
        MaxStackOverflowPolicy:
          Type: enum
          ValuesRef: MaxStackOverflowPolicy
          Default: ReplaceOldest
          Nullable: true
      Rules:
        - StackScope ByStackGroupId requires StackGroupId.
        - MaxStacks is the canonical stack limit field. MaxStacksToOverflow and LimitStacks are invalid.
        - If StackPolicy is Stack and MaxStacks is set, MaxStacks must be greater than 0.
        - When MaxStacks is reached, use MaxStackOverflowPolicy. Default is ReplaceOldest.
        - AccumulateWhileActive follows normal stacking first.
        - If an AccumulateWhileActive effect is refreshed, keep accumulated value and refresh only duration.
        - If an AccumulateWhileActive effect is replaced, remove the old ActiveEffect and accumulator, then create a new ActiveEffect with a fresh accumulator.
        - If StackBehavior is IndependentStacks for AccumulateWhileActive, each accepted ActiveEffect has its own independent accumulator.
    Visibility:
      Type: enum
      ValuesRef: Visibility
      Default: Internal
    ChildEffectDefinitions:
      Type: array
      ItemsRef: ChildEffectDefinition
      Nullable: true
      Rules:
        - Child effects are processed in deterministic list order.
    IsEffectContainer:
      Type: bool
      Default: false
  Rules:
    - An effect is valid if IsEffectContainer is false and at least one of Target, ConditionRequests, EffectClassifications, EffectRemovalRequest, or ChildEffectDefinitions is present.
    - A container is valid if IsEffectContainer is true, Target is omitted, ConditionRequests is omitted, EffectClassifications is omitted or empty, EffectRemovalRequest is omitted, and ChildEffectDefinitions is present with at least one entry.
    - EffectDefinitions are validated once at startup. An EffectDefinition is valid only if all referenced child definitions are valid and the child graph is acyclic.
    - ConditionAndClassificationRequests, ClassificationsAddRequest, and ClassificationsRemoveRequest are invalid in 6.3.0.
ReusableSchemas:
  TriggerCondition:
    Type: object
    Required:
      - Type
    Fields:
      Type:
        Type: enum
        ValuesRef: TriggerConditionType
      Conditions:
        Type: array
        Items: Condition
        Nullable: true
      Classifications:
        Type: array
        Items: EffectClassification
        Nullable: true
      Operator:
        Type: enum
        ValuesRef: ConditionOperator
        Default: Any
      Stat:
        Type: Stat
        Nullable: true
      TargetValueKind:
        Type: enum
        ValuesRef: TargetValueKind
        Nullable: true
      ThresholdPercent:
        Type: float
        Nullable: true
    Rules:
      - OnConditionsPresent and OnConditionsMissing require Conditions containing canonical EntityCondition gameplay tags.
      - OnClassificationsPresent and OnClassificationsMissing require Classifications containing canonical EffectClassification gameplay tags.
      - Condition and classification trigger selectors may use parent/category tags and match expanded tag masks.
      - OnStatRaised and OnStatReduced require Stat and TargetValueKind and trigger from validated StatModificationRecords.
      - OnStatValueBelow and OnStatValueAbove require Stat and ThresholdPercent and evaluate after final stat resolution.
  ChildEffectDefinition:
    Type: object
    Required:
      - ChildEffectDefinitionId
    Fields:
      ChildEffectDefinitionId:
        Type: EffectDefinitionId
      ChildEffectTrigger:
        Type: enum
        ValuesRef: ChildEffectTrigger
        Default: BoundToParent
    Rules:
      - BoundToParent creates the child when the parent triggers and removes/expires the child with the parent.
      - OnParentExpired creates an independent child only when the parent expires naturally.
      - OnParentRemoved creates an independent child only when the parent is explicitly removed before natural expiry.
      - OnParentExpiredOrRemoved creates an independent child when the parent either expires naturally or is explicitly removed.
  ConditionRequest:
    Type: object
    Required:
      - Timing
    Fields:
      Timing:
        Type: enum
        ValuesRef: ConditionLifecycleTiming
        Nullable: false
      RemoveMode:
        Type: enum
        ValuesRef: ConditionRemoveMode
        Nullable: true
        Default: InferredByTiming
      ConditionsAddRequest:
        Type: array
        Items: Condition
        Nullable: true
      ConditionsRemoveRequest:
        Type: array
        Items: Condition
        Nullable: true
    DefaultTimingInference:
      - When:
          TriggerType: Immediate
        Default: OnFirstExecution
      - When:
          TriggerType: WhileActive
        Default: OnFirstApplication
      - When:
          TriggerType: OverTime
        Default: OnFirstExecution
      - When:
          TriggerType: OnExpire
        Default: OnExpire
      - When:
          TriggerType: OnRemoval
        Default: OnRemove
    DefaultRemoveModeInference:
      - When:
          Timing: OnFirstApplication
        Default: RemoveAllContributions
      - When:
          Timing: OnFirstExecution
        Default: RemoveAllContributions
      - When:
          Timing: OnExpire
        Default: RemoveOwnContribution
      - When:
          Timing: OnRemove
        Default: RemoveOwnContribution
      - When:
          Timing: OnExpireOrRemove
        Default: RemoveOwnContribution
    Rules:
      - At least one of ConditionsAddRequest or ConditionsRemoveRequest must contain at least one condition.
      - ConditionsAddRequest and ConditionsRemoveRequest values must be fully qualified, assignable EntityCondition gameplay tags.
      - ConditionsAddRequest records this ActiveEffect runtime instance as a contributor for each listed condition.
      - ConditionsRemoveRequest with RemoveOwnContribution removes only this ActiveEffect runtime instance contribution for each listed condition.
      - ConditionsRemoveRequest with RemoveAllContributions clears each listed condition from the target and removes all contributor ownership records for that condition.
      - OnFirstApplication is invalid for discarded duplicates because no accepted runtime effect instance exists.
      - OnFirstExecution must not refire after retry failures, refreshes, or later successful ticks.
      - OnExpire is valid only when Duration.DurationType is Temporary.
      - OnRemove is valid only when Duration.DurationType is Temporary or UntilRemoved.
      - OnExpireOrRemove is valid only when Duration.DurationType is Temporary or UntilRemoved.
      - Explicit Timing and RemoveMode values are accepted only if they satisfy these rules; otherwise the validator rejects the definition.
EffectRuntimeSchema:
  Type: object
  Required:
    - EffectRuntimeId
    - EffectDefinitionId
    - SourceId
    - OriginId
    - TargetEntityId
    - AppliedNetworkTick
  Fields:
    EffectRuntimeId:
      Type: id
    EffectProcessing:
      Type: enum
      ValuesRef: EffectProcessing
      Readonly: true
    EffectDefinitionId:
      Type: EffectDefinitionId
      Readonly: true
    SourceId:
      Type: SourceId
      Readonly: true
    OriginId:
      Type: OriginId
      Readonly: true
    TargetEntityId:
      Type: EntityId
      Readonly: true
    AppliedNetworkTick:
      Type: long
    LastExecutedNetworkTick:
      Type: long
      Default: -1
    LastTriggeredNetworkTick:
      Type: long
      Default: -1
    ExpiresNetworkTick:
      Type: long
      Nullable: true
    StackCount:
      Type: int
      Default: 1
    AppliedTickCount:
      Type: int
      Default: 0
      UsedBy: AccumulateWhileActive
    AccumulatedFlatModifier:
      Type: float
      Default: 0.0
      UsedBy: AccumulateWhileActive
    AccumulatedPercentageModifier:
      Type: float
      Default: 0.0
      UsedBy: AccumulateWhileActive
      Rules:
        - Reduce contributions are capped at -1.0 before stat resolution contribution.
    ParentEffectRuntimeId:
      Type: id
      Nullable: true
    ChildDepth:
      Type: int
      Default: 0
    HasFiredOnFirstApplication:
      Type: bool
      Default: false
      UsedBy: ConditionRequests
    HasFiredOnFirstExecution:
      Type: bool
      Default: false
      UsedBy: ConditionRequests
    RuntimeFlags:
      Type: flags
      Nullable: true
  Rules:
    - EffectClassifications are read from the immutable EffectDefinition and treated as static metadata on the ActiveEffect while it exists.
    - HasFiredOnFirstApplication and HasFiredOnFirstExecution prevent lifecycle condition requests from firing more than once per runtime instance.
    - Condition contribution ownership is stored by the StateEngine as EntityCondition tag -> contributor EffectRuntimeIds. It may be stored outside the compact ActiveEffect record.
