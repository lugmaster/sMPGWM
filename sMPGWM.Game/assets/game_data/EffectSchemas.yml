GameplayTagTypes:
  Condition:
    DomainKey: EntityCondition
    RootPrefix: Condition
    ValueForm: CanonicalFullName
    DirectAssignmentFields:
      - ConditionRequests[].ConditionsAddRequest
      - ConditionRequests[].ConditionsRemoveRequest
    SelectorFields:
      - Trigger.TriggerConditions[].Conditions
      - Blocking.BlockedByCondition
      - EffectRemovalRequest.Conditions
  EffectClassification:
    DomainKey: EffectClassification
    RootPrefix: Effect
    ValueForm: CanonicalFullName
    DirectAssignmentFields:
      - EffectClassifications
    SelectorFields:
      - Trigger.TriggerConditions[].Classifications
      - Blocking.BlockedByClassification
      - EffectRemovalRequest.Classifications
  Rules:
    - Canonical values must begin with the domain root prefix and must resolve through the frozen TagRegistry.
    - DirectAssignmentFields require assignable tags. Canonical gameplay data uses leaf tags for direct assignments.
    - SelectorFields may reference any queryable tag in the declared domain, including parent/category tags.
    - SelectorFields match expanded tag masks by default, so a selector for Effect.Damage.Poison matches a direct Effect.Damage.Poison.Dot classification.
    - Parent/category tags must be explicitly defined before child tags are accepted. Missing parents are startup validation errors.
    - Short names and aliases may be accepted only by import or migration tooling before canonical validation.
