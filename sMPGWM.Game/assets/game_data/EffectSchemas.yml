SchemaVersion: 1.0.0
SchemaKind: FLU.RPG.StateEngine.Effects
SourcePrecedence:
  - EffectSchemas.yml and EffectDefinitions.yml decisions from source YAML and clarification answers
  - Extracted Effects section
  - PRD 6.1 context
DecisionsApplied:
  - BlockPolicy canonical enum value is RemoveOnFail, not ConsumeOnFail.
  - Stack limit field is MaxStacks. LimitStacks and MaxStacksToOverflow are removed.
  - OverTimeConstant is a persistent active modifier/state-carrier while active; it does not tick and ignores TickIntervalMs.
  - ResourcePool stats use Current for transactional changes only; persistent buffs/debuffs target Max.
  - Attribute stats, including rate/regen/production/consumption stats, may use Current as effective runtime value; temporary
    Current modifiers are recalculated from active effects and snap back to Max when removed.
  - ClassificationsAddRequest attaches classifications to the ActiveEffect metadata only; classifications are not target-state
    flags. ClassificationsRemoveRequest is removed.
  - 'ChildEffectDefinitions use per-child ChildEffectTrigger values: BoundToParent, OnParentExpired, OnParentRemoved, OnParentExpiredOrRemoved.'
  - 'StackScope enum remains: ByEffectDefinitionId, SameSource, SameSourceAndOrigin, ByStackGroupId.'
  - 'EffectRemovalPolicy enum remains: ByAnySource, BySourceId, ByOriginId.'
  - 'Calculation Percentage values are decimal fractions: 0.50 means 50 percent.'
