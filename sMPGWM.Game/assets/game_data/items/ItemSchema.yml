# Aggregate authoring schema. Runtime loading validates each category's .schema.yml.
$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
- Version
- Items
properties:
  Version:
    type: string
    const: 3.0.0
  Items:
    type: array
    items:
      oneOf:
      - $ref: '#/definitions/engine'
      - $ref: '#/definitions/hull'
      - $ref: '#/definitions/shield_generator'
      - $ref: '#/definitions/reactor'
      - $ref: '#/definitions/light_weapon'
      - $ref: '#/definitions/medium_weapon'
      - $ref: '#/definitions/heavy_weapon'
      - $ref: '#/definitions/consumable'
      - $ref: '#/definitions/resource'
      - $ref: '#/definitions/battery'
      - $ref: '#/definitions/weapon_fixture'
definitions:
  engine:
    type: object
    additionalProperties: false
    required:
    - Id
    - DisplayName
    - Description
    - CategoryId
    - EnergyConsumption
    - Speed
    - AfterBurnerSpeed
    - RotationSpeed
    - Acceleration
    - AfterBurnerAcceleration
    - Mass
    not:
      required:
      - CanStack
      - StackLimit
    properties:
      Id:
        type: string
        pattern: \S
      DisplayName:
        type: string
        pattern: \S
      CategoryId:
        const: engine
      Description:
        type: string
        pattern: \S
      CanStack:
        type: boolean
      Icon:
        type:
        - string
        - 'null'
        pattern: ^[A-Za-z][A-Za-z0-9_]*\.[A-Za-z][A-Za-z0-9_]*(?![\s\S])
      StackLimit:
        type: integer
        minimum: 2
        maximum: 2147483646
      AbilityIds:
        type: array
        items:
          type: string
          pattern: ^[a-z][A-Za-z0-9_]*(?![\s\S])
          maxLength: 64
        minItems: 1
      BehaviourGrants:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - BehaviourId
          - While
          - Lifetime
          properties:
            BehaviourId:
              type: string
              pattern: ^[a-z][A-Za-z0-9_]*(?![\s\S])
              maxLength: 64
            While:
              type: string
              enum:
              - Carried
              - Equipped
            Lifetime:
              type: string
              enum:
              - WhileSourceActive
        minItems: 1
      EnergyConsumption:
        type: number
        minimum: 0
        maximum: 1.7976931348623157e+308
      Speed:
        type: number
        minimum: 0
        maximum: 3.4028234663852886e+38
      AfterBurnerSpeed:
        type: number
        minimum: 0
        maximum: 3.4028234663852886e+38
      RotationSpeed:
        type: number
        minimum: 0
        maximum: 3.4028234663852886e+38
      Acceleration:
