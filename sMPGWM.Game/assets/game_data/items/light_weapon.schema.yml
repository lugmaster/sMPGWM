$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
- Version
- Items
properties:
  Version:
    const: 3.0.0
  Items:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - Id
      - DisplayName
      - CategoryId
      - Values
      - Weapon
      not:
        required:
        - CanStack
        - StackLimit
      properties:
        Id:
          type: string
          pattern: \S
        DisplayName:
          type: string
          pattern: \S
        CategoryId:
          const: light_weapon
        Description:
          type: string
        CanStack:
          const: false
        Icon:
          type:
          - string
          - 'null'
        StackLimit: false
        Values:
          type: object
          additionalProperties: false
          properties:
            DamageSource:
              type: string
              pattern: \S
            Damage:
              type: number
              minimum: 0
            AttackSpeed:
              type: number
              exclusiveMinimum: 0
              maximum: 60
            EnergyConsumption:
              type: number
              minimum: 0
            EnergyPerShot:
              type: number
              exclusiveMinimum: 0
            ReloadDuration:
              type: number
              exclusiveMinimum: 0
              maximum: 7.686143364045645e+19
            Mass:
              type: number
              minimum: 0
            Range:
              type: number
              exclusiveMinimum: 0
              maximum: 8.5070586659632215e+37
            SpreadDegrees:
              type: number
              minimum: 0
              maximum: 180
            MagazineCapacity:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - DamageSource
          - Damage
          - AttackSpeed
          - Range
          - SpreadDegrees
          - EnergyConsumption
          - Mass
        AbilityIds:
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9_]*$
          minItems: 1
        BehaviourGrants:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - BehaviourId
            - While
            - Lifetime
            properties:
              BehaviourId:
                type: string
                pattern: ^[a-z][A-Za-z0-9_]*$
              While:
                type: string
                enum:
                - Carried
                - Equipped
              Lifetime:
                type: string
                enum:
                - WhileSourceActive
          minItems: 1
        Weapon:
          type: object
          additionalProperties: false
          required:
          - Archetype
          - Delivery
          - FireMode
          - SupplyMode
          - PresentationId
          properties:
            Archetype:
              type: string
              pattern: ^[A-Za-z][A-Za-z0-9_]*$
              maxLength: 64
            Delivery:
              const: HitScan
            FireMode:
              const: Automatic
            SupplyMode:
              enum:
              - Ammunition
              - Energy
            PresentationId:
              enum:
              - smg_standard
              - laser_standard
      allOf:
      - if:
          properties:
            Weapon:
              properties:
                SupplyMode:
                  const: Ammunition
        then:
          properties:
            Values:
              required:
              - MagazineCapacity
              - ReloadDuration
              not:
                required:
                - EnergyPerShot
        else:
          properties:
            Values:
              required:
              - EnergyPerShot
              not:
                anyOf:
                - required:
                  - MagazineCapacity
                - required:
                  - ReloadDuration
