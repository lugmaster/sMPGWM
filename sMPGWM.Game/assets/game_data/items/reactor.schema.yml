$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
- Version
- Items
properties:
  Version:
    type: string
    const: 3.0.0
  Items:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - Id
      - DisplayName
      - CategoryId
      - Mass
      - EnergyProduction
      not:
        required:
        - CanStack
        - StackLimit
      properties:
        Id:
          type: string
          pattern: \S
        DisplayName:
          type: string
          pattern: \S
        CategoryId:
          const: reactor
        Description:
          type: string
        CanStack:
          type: boolean
        Icon:
          type:
          - string
          - 'null'
        StackLimit:
          type: integer
          minimum: 2
          maximum: 2147483646
        AbilityIds:
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9_]*$
          minItems: 1
        BehaviourGrants:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - BehaviourId
            - While
            - Lifetime
            properties:
              BehaviourId:
                type: string
                pattern: ^[a-z][A-Za-z0-9_]*$
              While:
                type: string
                enum:
                - Carried
                - Equipped
              Lifetime:
                type: string
                enum:
                - WhileSourceActive
          minItems: 1
        Mass:
          type: number
          minimum: 0
        EnergyProduction:
          type: number
          minimum: 0
