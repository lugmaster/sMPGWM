$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
- Version
- Items
properties:
  Version:
    type: string
    const: 3.0.0
  Items:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - Id
      - DisplayName
      - CategoryId
      - DamageSource
      - Damage
      - AttackSpeed
      - EnergyConsumption
      - Mass
      - Archetype
      - DeliveryType
      - PresentationId
      - Range
      - Supply
      not:
        required:
        - CanStack
        - StackLimit
      properties:
        Id:
          type: string
          pattern: \S
        DisplayName:
          type: string
          pattern: \S
        CategoryId:
          const: medium_weapon
        Description:
          type: string
        CanStack:
          type: boolean
        Icon:
          type:
          - string
          - 'null'
        StackLimit:
          type: integer
          minimum: 2
          maximum: 2147483646
        AbilityIds:
          type: array
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9_]*$
          minItems: 1
        BehaviourGrants:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - BehaviourId
            - While
            - Lifetime
            properties:
              BehaviourId:
                type: string
                pattern: ^[a-z][A-Za-z0-9_]*$
              While:
                type: string
                enum:
                - Carried
                - Equipped
              Lifetime:
                type: string
                enum:
                - WhileSourceActive
          minItems: 1
        DamageSource:
          type: string
          pattern: \S
        Damage:
          type: number
          minimum: 0
        AttackSpeed:
          type: number
          exclusiveMinimum: 0
        EnergyConsumption:
          type: number
          minimum: 0
        Mass:
          type: number
          minimum: 0
        Archetype:
          type: string
          pattern: \S
        DeliveryType:
          type: string
          enum:
          - HitScan
          - Projectile
        PresentationId:
          type: string
          pattern: \S
        Range:
          type: number
          exclusiveMinimum: 0
        SpreadDegrees:
          type: number
          minimum: 0
          maximum: 180
          default: 0
        Supply:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - Mode
            - AmmoCapacity
            - ReloadDuration
            properties:
              Mode:
                const: Ammunition
              AmmoCapacity:
                type: integer
                minimum: 1
                maximum: 2147483647
              ReloadDuration:
                type: number
                exclusiveMinimum: 0
          - type: object
            additionalProperties: false
            required:
            - Mode
            - EnergyPerShot
            properties:
              Mode:
                const: Energy
              EnergyPerShot:
                type: number
                exclusiveMinimum: 0
