Version: 1.2.0
Stats:
  - Id: health
    DisplayName: Health
    Description: "Health determines how damaged a ship is. Upon zero Health a ship is destroyed."
  - Id: armor
    DisplayName: Armor
    Description: "Armor reduces the incoming damage by a percentage."
  - Id: shield
    DisplayName: Shield
    Description: "Shield resource; maximum is the installed generator ShieldCapacity. Protection requires powered, available shields."
  - Id: energy
    DisplayName: Energy
    Description: "Energy supplies the ship systems with energy"
  - Id: battery
    DisplayName: Battery
    Description: "The additional amount of energy that can be saved when over producing"
  - Id: oxygen
    DisplayName: Oxygen
    Description: "Oxygen is consumed by the crew. It must always be present or the ships crew dies."
  - Id: food
    DisplayName: Food
    Description: "Food is consumed by the crew. It must always be present or the ships crew dies."
  - Id: water
    DisplayName: Water
    Description: "Water is consumed by the crew. It must always be present or the ships crew dies."
  - Id: weapon_slots
    DisplayName: Weapon Slots
    Description: "Indicates how many weapons can be equipped"
  - Id: mass
    DisplayName: Mass
    Description: "The higher the mass, the more the values of the engine are reduced"
  - Id: speed
    DisplayName: Speed
    Description: "The maximum speed a ship can reach"
  - Id: afterburner_speed
    DisplayName: Afterburner Speed
    Description: "The maximum afterburner speed a ship can reach"
  - Id: acceleration
    DisplayName: Acceleration
    Description: "The acceleration a ship has currently"
  - Id: afterburner_acceleration
    DisplayName: Afterburner Acceleration
    Description: "The afterburner acceleration a ship has currently"
  - Id: energy_storage
    DisplayName: Energy Storage
    Description: Energy resource; maximum is the installed battery EnergyStorage.
  - Id: energy_production
    DisplayName: Energy Production
    Description: Rate at which reactors produce energy.
    # leave this alone for now - tbd later. 
  - Id: attack_speed
    DisplayName: Attack Speed
    Description: Weapon attack rate; increasing this value makes attacks faster.
  - Id: rotation_speed
    DisplayName: Rotation Speed
    Description: Engine rotation rate before mass inertia.
  - Id: energy_consumption
    DisplayName: Energy Consumption
    Description: Total equipped passive energy demand per second, including idle and unpowered systems.
  - Id: recharge_time
    DisplayName: Shield Recharge Time
    Description: Milliseconds to regenerate from zero to ShieldCapacity.
  - Id: down_time
    DisplayName: Shield Down Time
    Description: Milliseconds without shield protection or regeneration after shield charge reaches zero.
