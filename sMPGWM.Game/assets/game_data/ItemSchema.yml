$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
required:
  - Items
properties:
  Items:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - Id
        - DisplayName
        - CategoryId
      not:
        required: [CanStack, StackLimit]
      properties:
        Id:
          type: string
          pattern: '\S'
        DisplayName:
          type: string
          pattern: '\S'
        CategoryId:
          type: string
          pattern: '\S'
        Description:
          type: string
        CanStack:
          type: boolean
        Icon:
          type: [string, 'null']
        StackLimit:
          type: integer
          minimum: 2
          maximum: 2147483646
