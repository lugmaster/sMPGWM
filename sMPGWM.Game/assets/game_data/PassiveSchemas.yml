SchemaVersion: 1.0.0
SchemaKind: FLU.RPG.StateEngine.Passives
SourcePrecedence:
  - TagSystem.md version 1.1.0
  - FLU_RPG_StateEngine_PRD.md version 6.3.0
  - Effects.md active-effect boundary
  - Stats.md passive stat layer
  - LivingEntityState.md passive result storage and snapshot requirements
  - LivingEntityRegistry.md lifecycle and cleanup boundaries
  - Passives.md version 1.0.0
DecisionsApplied:
  - Passives are not EffectDefinition entries and are not ActiveEffect runtime records.
  - PassiveDefinition supports stat modifiers and reactive triggers.
  - Passive sources generate source-bound PassiveEffect runtime records processed by the StateEngine passive path.
  - PassiveEffect lifetime is bound to its source. Removing or replacing the source removes the PassiveEffect and clears its runtime state.
  - PassiveRuntime state is stored in StateEngine-owned passive runtime buffers keyed by TargetEntityId.
  - PassiveRuntime state is included in StateEngine snapshots for rollback and resimulation.
  - Passive stat modifiers target EffectiveMaxValue only.
  - Passive stat modifiers use flat modifiers first, then additive percentage modifiers.
  - Passives are evaluated through explicit EvaluationPolicies.
  - Stable permanent passives should use OnSourceDirty, not per-tick evaluation.
  - Reactive passives may use OnEvent and OnTickWhileRuntimeActive.
  - Reactive passive outputs emit ActiveEffectSpec records instead of mutating LivingEntityState directly.
  - ActiveEffectSpec supports deterministic set-by-caller runtime magnitude override for allowed fields.
  - Same-tick passive reactions are processed through a bounded deterministic result-event queue.
  - Same-event passive ordering is TargetEntityId, PassiveInsertionSequence, PassiveRuntimeId.
  - Passive source stacking uses passive-adapted active stacking concepts.
  - Event-driven runtime stacks use RuntimeStacking and are separate from source-level Stacking.
  - Reactive passives may own runtime cooldown state such as CooldownUntilNetworkTick.
  - Passive metadata uses Gameplay Tag domain PassiveClassification with root Passive.
  - Passive tags are not EntityCondition tags and are not EffectClassification tags.
  - Bloodsucker is modeled as a reactive passive with 10 stacks, 3 percent heal per stack, 30 percent maximum, and 5000 ms shared stack duration.

