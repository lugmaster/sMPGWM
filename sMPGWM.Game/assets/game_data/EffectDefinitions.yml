Version: 6.3.0
BasicRevive:
  Definition:
    EffectDefinitionId: effect.revive.basic
    Name: Basic Revive
    Description: Container effect that restores Health and removes Dead during revive.
  IsEffectContainer: true
  CanTriggerWhileDead: true
  Visibility: Internal
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  ChildEffectDefinitions:
    - ChildEffectDefinitionId: effect.revive.restore_health
      ChildEffectTrigger: BoundToParent
    - ChildEffectDefinitionId: effect.revive.remove_dead
      ChildEffectTrigger: BoundToParent
CleansePoison:
  Definition:
    EffectDefinitionId: effect.cleanse.poison
    Name: Cleanse Poison
    Description: Removes poison-classified active effects from the target.
  EffectProcessing: Fast
  Trigger:
    TriggerType: Immediate
  Duration:
    DurationType: Once
  EffectRemovalRequest:
    Classifications:
      - Effect.Damage.Poison
      - Effect.Corroding
    EffectRemovalBehaviour:
      MaxRemoveCount: 3
      RemoveOldestFirst: true
  EffectRemovalPolicy: ByAnySource
  CanTriggerWhileDead: false
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  Visibility: Hud
  
CorrodingPoison:
  Definition:
    EffectDefinitionId: effect.while_active.corroding_poison
    Name: Corroding Poison
    Description: Applies up to 5 stacks. Each stack temporarily reduces effective Armor by 5% while active, then Armor snaps back when the effect expires or is removed.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 1500.0
  EffectClassifications:
    - Effect.Corroding
    - Effect.Debuff
  Target:
    TargetStat: Armor
    TargetValueKind: CurrentValue
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.05
    ApplicationMode: WhileActive
  ConditionRequests:
    - Timing: OnFirstApplication
      ConditionsAddRequest:
        - Condition.Poisoned
    - Timing: OnExpireOrRemove
      RemoveMode: RemoveOwnContribution
      ConditionsRemoveRequest:
        - Condition.Poisoned
  Blocking:
    BlockPolicy: Retry
    BlockedByClassification:
      - Effect.Immunity.Poison
      - Effect.Immunity.Corrosion
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: AddStackRefreshDuration
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud

DelayedExplosion:
