Heal:
  Definition:
    EffectDefinitionId: effect.raise.heal
    Name: Heal
    Description: Raises the target entity current Health by a flat amount.
  Trigger:
    TriggerType: Immediate
  Duration:
    DurationType: Once
  Target:
    TargetStat: Health
    TargetValueKind: Current
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Incurable
    BlockedByClassification:
      - CannotBeHealed
  Visibility: Internal
CurseOfEternity:
  Definition:
    EffectDefinitionId: effect.permanent.curse_of_eternity
    Name: Curse Of Eternity
    Description: Applies a permanent curse that reduces max EnergyStorage by 50% and requests removal of active effects targeting
      EnergyRegeneration.
  Trigger:
    TriggerType: Immediate
  Duration:
    DurationType: Permanent
  Target:
    TargetStat: EnergyStorage
    TargetValueKind: Max
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.5
  ConditionAndClassificationRequests:
    ConditionsAddRequest:
      - Cursed
    ClassificationsAddRequest:
      - CannotBeRegenerated
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByClassification:
      - CurseImmunity
    BlockedByCondition:
      - Invulnerable
  EffectRemovalRequest:
    EffectsTargetingStats:
      - EnergyRegeneration
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  Visibility: Hud
CorrodingPoison:
  Definition:
    EffectDefinitionId: effect.overtime_constant.corroding_poison
    Name: Corroding Poison
    Description: Applies up to 5 stacks. Each stack temporarily reduces effective Armor by 5% while active, then Armor snaps
      back when the effect expires or is removed.
  Trigger:
    TriggerType: OverTimeConstant
  Duration:
    DurationType: Temporary
    DurationMS: 1500.0
  Target:
    TargetStat: Armor
    TargetValueKind: Current
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.05
  ConditionAndClassificationRequests:
    ConditionsAddRequest:
      - Poisoned
    ClassificationsAddRequest:
      - Corroding
      - Poison
      - Debuff
  Blocking:
    BlockPolicy: Retry
    BlockedByClassification:
      - ImmuneToPoison
      - ImmuneToCorroding
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: AddStackRefreshDuration
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
Revive:
  Definition:
    EffectDefinitionId: effect.health.revive
    Name: Revive
    Description: Removes Dead and restores a flat amount of current Health.
  Trigger:
    TriggerType: Immediate
    TriggerConditions:
      - Type: OnConditionsPresent
        Conditions:
          - Dead
        Operator: All
  Duration:
    DurationType: Once
  Target:
    TargetStat: Health
    TargetValueKind: Current
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
  ConditionAndClassificationRequests:
    ConditionsRemoveRequest:
      - Dead
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Incurable
    BlockedByClassification:
      - CannotBeHealed
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  CanTriggerWhileDead: true
  Visibility: Internal
SuperEvilDot:
  Definition:
    EffectDefinitionId: effect.dot.super_evil_dot
    Name: Super Evil Dot
    Description: Applies up to 5 stacks. Each stack reduces current Health by 75 every 300ms while active.
  Trigger:
    TriggerType: OverTime
    TickIntervalMs: 300.0
  Duration:
    DurationType: Temporary
    DurationMS: 2100.0
  Target:
    TargetStat: Health
    TargetValueKind: Current
    Manipulation: Reduce
    Calculation: Flat
    Value: 75.0
  ConditionAndClassificationRequests:
    ClassificationsAddRequest:
      - AffectedBySuperEvilDot
      - Debuff
  Blocking:
    BlockPolicy: Retry
    BlockedByCondition:
      - Invulnerable
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: AddStackRefreshDuration
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
Overheating:
  Definition:
    EffectDefinitionId: effect.buff.weapon.overheating
    Name: Overheating
    Description: Temporarily raises effective AttackSpeed by 50%. When the buff expires naturally, it applies the Overheating
      Cooldown child effect.
  Trigger:
    TriggerType: OverTimeConstant
  Duration:
    DurationType: Temporary
    DurationMS: 5000.0
  Target:
    TargetStat: AttackSpeed
    TargetValueKind: Current
    Manipulation: Raise
    Calculation: Percentage
    Value: 0.5
  ConditionAndClassificationRequests:
    ClassificationsAddRequest:
      - Overheating
      - Buff
  ChildEffectDefinitions:
    - ChildEffectDefinitionId: effect.buff.weapon.overheating.cooldown
      ChildEffectTrigger: OnParentExpired
  Stacking:
    StackGroupId: 123
    StackScope: ByStackGroupId
    StackPolicy: Discard
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - EnergyDrained
      - Overheated
  Visibility: Hud
OverheatingCooldown:
  Definition:
    EffectDefinitionId: effect.buff.weapon.overheating.cooldown
    Name: Overheating Cooldown
    Description: Applies the Overheated condition while active. Attack effects should block against condition Overheated.
  Trigger:
    TriggerType: OverTimeConstant
  Duration:
    DurationType: Temporary
    DurationMS: 5000.0
  ConditionAndClassificationRequests:
    ConditionsAddRequest:
      - Overheated
    ClassificationsAddRequest:
      - OverheatingCooldown
      - Debuff
  Stacking:
    StackGroupId: 123
    StackScope: ByStackGroupId
    StackPolicy: Discard
  Visibility: Hud
