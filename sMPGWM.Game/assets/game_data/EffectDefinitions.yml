Revive:
  Definition:
    EffectDefinitionId: effect.health.revive
    Name: Revive
    Description: Removes Dead and restores a flat amount of current Health.
  Trigger:
    TriggerType: Immediate
    TriggerConditions:
      - Type: OnConditionsPresent
        Conditions:
          - Condition.Dead
        Operator: All
  Duration:
    DurationType: Once
  Target:
    TargetStat: Health
    TargetValueKind: CurrentValue
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
    ApplicationMode: Instant
  ConditionRequests:
    - Timing: OnFirstExecution
      RemoveMode: RemoveAllContributions
      ConditionsRemoveRequest:
        - Condition.Dead
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Condition.Incurable
    BlockedByClassification:
      - Effect.CannotBeHealed
  CanTriggerWhileDead: true
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  Visibility: Internal

