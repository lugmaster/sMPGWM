Version: 6.2.3
Heal:
  Definition:
    EffectDefinitionId: effect.raise.heal
    Name: Heal
    Description: Raises the target entity current Health by a flat amount.
  Trigger:
    TriggerType: Immediate
  Duration:
    DurationType: Once
  Target:
    TargetStat: Health
    TargetValueKind: CurrentValue
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
    ApplicationMode: Instant
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Incurable
    BlockedByClassification:
      - CannotBeHealed
  Visibility: Internal
EnergyStorageCurse:
  Definition:
    EffectDefinitionId: effect.curse.energy_storage_capacity
    Name: Energy Storage Curse
    Description: Reduces EnergyStorage capacity by 50% while active and requests removal of active effects targeting EnergyProduction.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: UntilRemoved
  EffectClassifications:
    - CannotBeRegenerated
    - Debuff
  Target:
    TargetStat: EnergyStorage
    TargetValueKind: CurrentMaxValue
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.5
    ApplicationMode: WhileActive
  ConditionRequests:
    - Timing: OnFirstApplication
      ConditionsAddRequest:
        - Cursed
    - Timing: OnExpireOrRemove
      RemoveMode: RemoveOwnContribution
      ConditionsRemoveRequest:
        - Cursed
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByClassification:
      - CurseImmunity
    BlockedByCondition:
      - Invulnerable
  EffectRemovalRequest:
    EffectsTargetingStats:
      - EnergyProduction
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  Visibility: Hud
CorrodingPoison:
  Definition:
    EffectDefinitionId: effect.while_active.corroding_poison
    Name: Corroding Poison
    Description: Applies up to 5 stacks. Each stack temporarily reduces effective Armor by 5% while active, then Armor snaps back when the effect expires or is removed.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 1500.0
  EffectClassifications:
    - Corroding
    - Poison
    - Debuff
  Target:
    TargetStat: Armor
    TargetValueKind: CurrentValue
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.05
    ApplicationMode: WhileActive
  ConditionRequests:
    - Timing: OnFirstApplication
      ConditionsAddRequest:
        - Poisoned
    - Timing: OnExpireOrRemove
      RemoveMode: RemoveOwnContribution
      ConditionsRemoveRequest:
        - Poisoned
  Blocking:
    BlockPolicy: Retry
    BlockedByClassification:
      - ImmuneToPoison
      - ImmuneToCorroding
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: AddStackRefreshDuration
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
Revive:
  Definition:
    EffectDefinitionId: effect.health.revive
    Name: Revive
    Description: Removes Dead and restores a flat amount of current Health.
  Trigger:
    TriggerType: Immediate
    TriggerConditions:
      - Type: OnConditionsPresent
        Conditions:
          - Dead
        Operator: All
  Duration:
    DurationType: Once
  Target:
    TargetStat: Health
    TargetValueKind: CurrentValue
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
    ApplicationMode: Instant
  ConditionRequests:
    - Timing: OnFirstExecution
      RemoveMode: RemoveAllContributions
      ConditionsRemoveRequest:
        - Dead
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Incurable
    BlockedByClassification:
      - CannotBeHealed
  CanTriggerWhileDead: true
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Discard
  Visibility: Internal
SuperEvilDot:
  Definition:
    EffectDefinitionId: effect.dot.super_evil_dot
    Name: Super Evil Dot
    Description: Applies up to 5 stacks. Each stack reduces current Health by 75 every 300ms while active.
  Trigger:
    TriggerType: OverTime
    TickIntervalMs: 300.0
  Duration:
    DurationType: Temporary
    DurationMS: 2100.0
  EffectClassifications:
    - AffectedBySuperEvilDot
    - Debuff
  Target:
    TargetStat: Health
    TargetValueKind: CurrentValue
    Manipulation: Reduce
    Calculation: Flat
    Value: 75.0
    ApplicationMode: Instant
  Blocking:
    BlockPolicy: Retry
    BlockedByCondition:
      - Invulnerable
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: AddStackRefreshDuration
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
MaxHealthRot:
  Definition:
    EffectDefinitionId: effect.rot.max_health
    Name: Max Health Rot
    Description: Every due tick accumulates a temporary Health capacity reduction. The accumulated reduction disappears when the effect expires or is removed.
  Trigger:
    TriggerType: OverTime
    TickIntervalMs: 1000.0
  Duration:
    DurationType: Temporary
    DurationMS: 5000.0
  EffectClassifications:
    - Infection
    - Debuff
  Target:
    TargetStat: Health
    TargetValueKind: CurrentMaxValue
    Manipulation: Reduce
    Calculation: Percentage
    Value: 0.05
    ApplicationMode: AccumulateWhileActive
  ConditionRequests:
    - Timing: OnFirstExecution
      ConditionsAddRequest:
        - Infected
    - Timing: OnExpireOrRemove
      RemoveMode: RemoveOwnContribution
      ConditionsRemoveRequest:
        - Infected
  Blocking:
    BlockPolicy: Retry
    BlockedByCondition:
      - Invulnerable
  EffectRemovalPolicy: ByAnySource
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Stack
    StackBehavior: IndependentStacks
    MaxStacks: 5
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
ShieldCapacityBoost:
  Definition:
    EffectDefinitionId: effect.buff.shield_capacity
    Name: Shield Capacity Boost
    Description: Raises Shield capacity by a flat amount while active. Positive capacity compensation may raise current Shield only for the capacity delta gained above EffectiveMaxValue.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 3000.0
  EffectClassifications:
    - Buff
  Target:
    TargetStat: Shield
    TargetValueKind: CurrentMaxValue
    Manipulation: Raise
    Calculation: Flat
    Value: 50.0
    ApplicationMode: WhileActive
  Blocking:
    BlockPolicy: RemoveOnFail
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Replace
    StackBehavior: RefreshDuration
    MaxStacks: 1
    MaxStackOverflowPolicy: ReplaceOldest
  Visibility: Hud
Overheating:
  Definition:
    EffectDefinitionId: effect.buff.weapon.overheating
    Name: Overheating
    Description: Temporarily raises effective AttackSpeed by 50%. When the buff expires naturally, it applies the Overheating Cooldown child effect.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 5000.0
  EffectClassifications:
    - Overheating
    - Buff
  Target:
    TargetStat: AttackSpeed
    TargetValueKind: CurrentValue
    Manipulation: Raise
    Calculation: Percentage
    Value: 0.5
    ApplicationMode: WhileActive
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - EnergyDrained
      - Overheated
  Stacking:
    StackGroupId: 123
    StackScope: ByStackGroupId
    StackPolicy: Discard
  Visibility: Hud
  ChildEffectDefinitions:
    - ChildEffectDefinitionId: effect.buff.weapon.overheating.cooldown
      ChildEffectTrigger: OnParentExpired
OverheatingCooldown:
  Definition:
    EffectDefinitionId: effect.buff.weapon.overheating.cooldown
    Name: Overheating Cooldown
    Description: Applies the Overheated condition while active. Attack effects should block against condition Overheated.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 5000.0
  EffectClassifications:
    - OverheatingCooldown
    - Debuff
  ConditionRequests:
    - Timing: OnFirstApplication
      ConditionsAddRequest:
        - Overheated
    - Timing: OnExpireOrRemove
      RemoveMode: RemoveOwnContribution
      ConditionsRemoveRequest:
        - Overheated
  Stacking:
    StackGroupId: 123
    StackScope: ByStackGroupId
    StackPolicy: Discard
  Visibility: Hud
EnergyProductionSurge:
  Definition:
    EffectDefinitionId: effect.buff.energy_production_surge
    Name: Energy Production Surge
    Description: Raises effective EnergyProduction rate while active. The Value is authored in EnergyProduction's per-ms unit.
  Trigger:
    TriggerType: WhileActive
  Duration:
    DurationType: Temporary
    DurationMS: 2500.0
  EffectClassifications:
    - Buff
  Target:
    TargetStat: EnergyProduction
    TargetValueKind: CurrentValue
    Manipulation: Raise
    Calculation: Percentage
    Value: 0.25
    ApplicationMode: WhileActive
  Stacking:
    StackScope: ByEffectDefinitionId
    StackPolicy: Replace
    StackBehavior: RefreshDuration
    MaxStacks: 1
  Visibility: Hud
DelayedExplosion:
  Definition:
    EffectDefinitionId: effect.delayed.explosion
    Name: Delayed Explosion
    Description: Deals Health damage when the effect expires naturally.
  Trigger:
    TriggerType: OnExpire
  Duration:
    DurationType: Temporary
    DurationMS: 2000.0
  EffectClassifications:
    - Fire
    - Debuff
  Target:
    TargetStat: Health
    TargetValueKind: CurrentValue
    Manipulation: Reduce
    Calculation: Flat
    Value: 100.0
    ApplicationMode: Instant
  Blocking:
    BlockPolicy: RemoveOnFail
    BlockedByCondition:
      - Invulnerable
  Visibility: Hud
