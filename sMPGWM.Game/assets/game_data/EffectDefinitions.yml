Version: 6.3.1
EffectDefinitions:
  - Id: revive
    DisplayName: Revive
    Description: Restores Health and removes status dead.
    Hint: Should simply revive another ship, that is dead, but has not choose to respawn.
    CanTriggerWhileDead: true
    Target:
      TargetStat: Health
      TargetValueKind: CurrentValue
      Manipulation: Raise
      Calculation: Flat
      Value: 50.0
    Trigger:
      TriggerType: OnApplication
    Duration:
      DurationType: Once
    Visibility: Internal
    Icon: Misc.MedkitMedicineHealthPickup

  - Id: disruptiveExplosion
    DisplayName: Disruptive Explosion
    Description: Shoots a ball of concentrated electromagnetic pulses (EMP) that burst on impact and disrupts the target.
    Hint: Can be used on any mechanical entity. It simply turns their systems down for a given time like you know an emp from other games.
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 1500.0
    EffectClassifications:
      - Effect.Disrupted
    ConditionRequests:
      - Timing: OnFirstApplication
        ConditionsAddRequest:
          - Condition.Disrupted
      - Timing: OnExpireOrRemove
        ConditionsRemoveRequest:
          - Condition.Disrupted
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByClassification:
        - Immunity.Disrupted
    EffectRemovalPolicy: ByAnySource
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Replace
      StackBehavior: RefreshDuration
      MaxStacks: 1
    Visibility: Hud
    Icon: Alchemy.PotionVialBottleLightningBoltZapSpeedEmpty

  - Id: removeDisrupted
    DisplayName: Remove Disrupted
    Description: Remove disrupted classified active effects from the target.
    Target:
      TargetStat: Energy
      TargetValueKind: CurrentValue
      Manipulation: Raise
      Calculation: Percentage
      Value: 10.0
    Trigger:
      TriggerType: OnApplication
    Duration:
      DurationType: Once
    EffectRemovalRequest:
      Classifications:
        - Effect.Disrupted
    ConditionRequests:
      - ConditionsRemoveRequest:
          - Condition.Disrupted
    EffectRemovalPolicy: ByAnySource
    Visibility: Hud
    Icon: Software.WiFiWirelessSignal2

  - Id: infection
    DisplayName: Infection
    Description: Applies up to 5 stacks. Each stack temporarily reduces effective Speed, AfterburnerSpeed and Energy Production by 5% while active.
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 1500.0
    EffectClassifications:
      - Effect.Infection
    Target:
      - TargetStat: Speed
        TargetValueKind: CurrentValue
        Manipulation: Reduce
        Calculation: Percentage
        Value: 0.05
        ApplicationMode: WhileActive
      - TargetStat: AfterburnerSpeed
        TargetValueKind: CurrentValue
        Manipulation: Reduce
        Calculation: Percentage
        Value: 0.05
        ApplicationMode: WhileActive
      - TargetStat: EnergyProduction
        TargetValueKind: CurrentValue
        Manipulation: Reduce
        Calculation: Percentage
        Value: 0.05
        ApplicationMode: WhileActive
    ConditionRequests:
      - Timing: OnFirstApplication
        ConditionsAddRequest:
          - Condition.Infected
      - Timing: OnExpireOrRemove
        ConditionsRemoveRequest:
          - Condition.Infected
    Blocking:
      BlockPolicy: Retry
      BlockedByClassification:
        - Immunity.Infection
    EffectRemovalPolicy: ByAnySource
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Stack
      MaxStacks: 5
      MaxStackOverflowPolicy: ReplaceOldest
    Visibility: Hud
    Icon: Hats.GasMaskCommando
    
  - Id: removeInfection
    DisplayName: Remove Infection
    Description: Removes 3 infection-classified active effects from the target.
    Trigger:
      TriggerType: OnApplication
    Duration:
      DurationType: Once
    EffectRemovalRequest:
      Classifications:
        - Effect.Infection
      EffectRemovalBehaviour:
        MaxRemoveCount: 3
        RemoveOldestFirst: true
    EffectRemovalPolicy: ByAnySource
    CanTriggerWhileDead: false
    Visibility: Hud
    Icon: Misc.HeartbeatLine1

  - Id: shieldRecharge
    DisplayName: Shield Recharge
    Description: Instantly restores 50% of the ships shield.
    Trigger:
      TriggerType: OnApplication
    Target:
      - TargetStat: Shield
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Percentage
        Value: 50.0
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByCondition:
        - Condition.Disabled
        - Condition.Disrupted
    Visibility: Hud
    Icon: Arrows.RoundaboutRotationCircleReloadRefreshLoop

  - Id: onDeathFailSafe
    DisplayName: Health Recharge
    Description: Restores 25% of the ships health and shield.
    Trigger:
      TriggerType: OnExpire
      TriggerCondition: BelowValue
      TriggerStat: Health
      TriggerValue: 10.0
      TriggerCalculation: Percent
    Duration:
      DurationType: Temporary
      Duration: 20000.0
    EffectClassifications:
      - Effect.HealthFailSafe
    Target:
      - TargetStat: Health
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Percentage
        Value: 25.0
        ApplicationMode: OnTrigger
      - TargetStat: Shield
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Percentage
        Value: 15.0
        ApplicationMode: OnTrigger
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByCondition:
        - Condition.Invulnerable
    Visibility: Hud
    Icons: Misc.SyringeDrugsMedicine2

  - Id: delayedExplosion
    DisplayName: Delayed Explosion
    Description: Deals Health damage when the effect expires naturally.
    Trigger:
      TriggerType: OnExpire
    Duration:
      DurationType: Temporary
      Duration: 2000.0
    EffectClassifications:
      - Effect.Physical
    Target:
      - TargetStat: Health
        TargetValueKind: CurrentValue
        Manipulation: Reduce
        Calculation: Flat
        Value: 100.0
        ApplicationMode: Instant
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByCondition:
        - Condition.Invulnerable
    Visibility: Hud
    Icon: Warfare.ExplosionBomb

  - Id: energyProductionSurge
    DisplayName: Energy Production Surge
    Description: Raises effective EnergyProduction rate while active.
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 2500.0
    EffectClassifications:
      - Effect.Buff.EnergyProduction
    Target:
      - TargetStat: EnergyProduction
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Percentage
        Value: 25.0
        ApplicationMode: WhileActive
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Replace
      StackBehavior: RefreshDuration
      MaxStacks: 1
    Visibility: Hud
    Icon: Software.PowerPluggedCordElectricity

  - Id: energyStorageMalfunction
    DisplayName: Energy Storage Malfunction
    Description: Reduces EnergyStorage capacity by 50% while active and requests removal of active effects targeting EnergyProduction.
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: UntilRemoved
    EffectClassifications:
      - Effect.Malfunction.EnergyStorage
      - Effect.Debuff.Malfunction
    Target:
      - TargetStat: EnergyStorage
        TargetValueKind: CurrentMaxValue
        Manipulation: Reduce
        Calculation: Percentage
        Value: 50.0
        ApplicationMode: WhileActive
    ConditionRequests:
      - Timing: OnFirstApplication
        ConditionsAddRequest:
          - Condition.Malfunction
      - Timing: OnExpireOrRemove
        ConditionsRemoveRequest:
          - Condition.Malfunction
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByClassification:
        - Effect.Immunity.Malfunction
    EffectRemovalRequest:
      EffectsTargetingStats:
        - Effect.Malfunction.EnergyStorage
    EffectRemovalPolicy: ByAnySource
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Discard
    Visibility: Hud
    Icon: Software.MobileCarrierSignalNoneDisabled

  - Id: maxHealthRot
    DisplayName: Max Health Rot
    Description: Every due tick accumulates a temporary Health capacity reduction. The accumulated reduction disappears when the effect expires or is removed.
    Trigger:
      TriggerType: OverTime
      TickIntervalMs: 1000.0
    Duration:
      DurationType: Temporary
      Duration: 5000.0
    EffectClassifications:
      - Effect.Infection
      - Effect.Debuff
    Target:
      TargetStat: Health
      TargetValueKind: CurrentMaxValue
      Manipulation: Reduce
      Calculation: Percentage
      Value: 0.05
      ApplicationMode: AccumulateWhileActive
    ConditionRequests:
      - Timing: OnFirstExecution
        ConditionsAddRequest:
          - Condition.Infected
      - Timing: OnExpireOrRemove
        RemoveMode: RemoveOwnContribution
        ConditionsRemoveRequest:
          - Condition.Infected
    Blocking:
      BlockPolicy: Retry
      BlockedByCondition:
        - Condition.Invulnerable
    EffectRemovalPolicy: ByAnySource
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Stack
      StackBehavior: IndependentStacks
      MaxStacks: 5
      MaxStackOverflowPolicy: ReplaceOldest
    Visibility: Hud

  - Id: raiseHealth
    DisplayName: Raise Health
    Description: Restores Health once.
    EffectProcessing: Fast
    Trigger:
      TriggerType: OnApplication
    Duration:
      DurationType: Once
    Target:
      - TargetStat: Health
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Flat
        Value: 35.0
        ApplicationMode: Instant
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByCondition:
        - Condition.Dead
        - Condition.Incurable
    EffectRemovalPolicy: ByAnySource
    CanTriggerWhileDead: false
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Discard
    Visibility: Hud

  - Id: overheating
    DisplayName: Overheating
    Description: Temporarily raises effective AttackSpeed by 50%. When the buff expires naturally, it applies the Overheating Cooldown child effect.
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 5000.0
    EffectClassifications:
      - Effect.Overheating
      - Effect.Buff.AttackSpeed
    Target:
      - TargetStat: AttackSpeed
        TargetValueKind: CurrentValue
        Manipulation: Raise
        Calculation: Percentage
        Value: 50.0
        ApplicationMode: WhileActive
    Blocking:
      BlockPolicy: RemoveOnFail
      BlockedByCondition:
        - Condition.EnergyDrained
        - Condition.Overheated
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Discard
    Visibility: Hud
    Cooldown: 15000.0
    ChildEffectDefinitions:
      - ChildEffectDefinitionId: effect.overheatingCooldown
        ChildEffectTrigger: OnParentExpired
    Icon: Weather.ThermometherTemperatureCelsiusFahrenheitKelvin1

  - Id: overheatingCooldown
    DisplayName: Overheating Cooldown
    Description: Applies the Overheated condition while active. Reduces the attack Speed by 75%.
    Trigger:
      TriggerType: WhileActive
    Target:
      - TargetStat: AttackSpeed
        TargetValueKind: CurrentValue
        Manipulation: Reduce
        Calculation: Percentage
        Value: 75.0
        ApplicationMode: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 2500.0
    EffectClassifications:
      - Effect.OverheatingCooldown
      - Effect.Debuff
    ConditionRequests:
      - Timing: OnFirstApplication
        ConditionsAddRequest:
          - Condition.Overheated
      - Timing: OnExpireOrRemove
        RemoveMode: RemoveOwnContribution
        ConditionsRemoveRequest:
          - Condition.Overheated
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Discard
    Visibility: Hud
    Icon: Weather.ThermometherTemperatureCelsiusFahrenheitKelvin2

  - Id: shieldCapacityBoost
    DisplayName: Shield Capacity Boost
    Description: Raises Shield capacity by a flat amount while active. 
    Trigger:
      TriggerType: WhileActive
    Duration:
      DurationType: Temporary
      Duration: 30000.0
    EffectClassifications:
      - Effect.Buff.ShieldCapacity
    Target:
      - TargetStat: Shield
        TargetValueKind: CurrentMaxValue
        Manipulation: Raise
        Calculation: Flat
        Value: 50.0
        ApplicationMode: WhileActive
    Blocking:
      BlockPolicy: RemoveOnFail
    Stacking:
      StackScope: ByEffectDefinitionId
      StackPolicy: Replace
      StackBehavior: RefreshDuration
      MaxStacks: 1
      MaxStackOverflowPolicy: ReplaceOldest
    Visibility: Hud
    Icon: Weather.SunnyWarmHotSummerSeason

