Version: 7.0.0
EffectDefinitions:
  - Id: revive
    DisplayName: revive
    Description: Atomically revive an eligible wreck; Health becomes min(50, effective maximum).
    Kind: Revive
    Health: 50
  - Id: restoreEnergy
    DisplayName: restoreEnergy
    Description: Restore 10% of effective maximum stored energy.
    Kind: RestoreResource
    StatId: energy_storage
    Amount:
      Kind: FractionOfMaximum
      Value: 0.1
  - Id: shieldRecharge
    DisplayName: shieldRecharge
    Description: Restore 50% maximum Shield; self-only restriction belongs to its ability.
    Kind: RestoreResource
    StatId: shield
    Amount:
      Kind: FractionOfMaximum
      Value: 0.5
    BlockedByConditions:
      - disabled
      - disrupted
  - Id: raiseHealth
    DisplayName: raiseHealth
    Description: Restore 35 Health to a living, curable target.
    Kind: RestoreResource
    StatId: health
    Amount:
      Kind: Flat
      Value: 35
    BlockedByConditions:
      - dead
      - incurable
  - Id: removeDisruption
    DisplayName: removeDisruption
    Description: Remove ordinarily removable disruption contributions.
    Kind: RemoveBehaviours
    Selector:
      ClassificationIds:
        - disruption
    Order: OldestFirst
  - Id: removeDisrupted
    DisplayName: removeDisrupted
    Description: Cleanse disruption, then restore energy even when nothing was removed.
    Kind: Sequence
    EffectIds:
      - removeDisruption
      - restoreEnergy
    ContinueOnFailure: true
  - Id: removeInfection
    DisplayName: removeInfection
    Description: Remove up to three independent infection stacks; source-bound grants are excluded.
    Kind: RemoveBehaviours
    Selector:
      ClassificationIds:
        - infection
    MaxCount: 3
    Order: OldestFirst
  - Id: removeProductionBuffs
    DisplayName: removeProductionBuffs
    Description: Remove removable buffs with an EnergyProduction modifier; all selector fields must match.
    Kind: RemoveBehaviours
    Selector:
      Disposition: Buff
      ModifiedStatIds:
        - energy_production
    Order: OldestFirst
  - Id: physicalExplosionDamage
    DisplayName: physicalExplosionDamage
    Description: Resolve 100 physical damage through normal shields, armor, and immunity rules.
    Kind: DealDamage
    DamageSourceId: physical
    Amount: 100
  - Id: detonate
    DisplayName: detonate
    Description: Explode at the behaviour owner position using original caster attribution.
    Kind: SearchArea
    TargetingId: hostileArea
    EffectId: physicalExplosionDamage
  - Id: applyDisrupted
    DisplayName: applyDisrupted
    Description: Apply disrupted using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: disrupted
  - Id: infection
    DisplayName: infection
    Description: Apply infection using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: infection
  - Id: onDeathFailSafe
    DisplayName: onDeathFailSafe
    Description: Apply onDeathFailSafe using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: onDeathFailSafe
  - Id: delayedExplosion
    DisplayName: delayedExplosion
    Description: Apply delayedExplosion using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: delayedExplosion
  - Id: energyProductionSurge
    DisplayName: energyProductionSurge
    Description: Apply energyProductionSurge using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: energyProductionSurge
  - Id: energyStorageMalfunction
    DisplayName: energyStorageMalfunction
    Description: Apply energyStorageMalfunction using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: energyStorageMalfunction
  - Id: maxHealthRot
    DisplayName: maxHealthRot
    Description: Apply maxHealthRot using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: maxHealthRot
  - Id: overheating
    DisplayName: overheating
    Description: Apply overheating using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: overheating
  - Id: overheatingCooldown
    DisplayName: overheatingCooldown
    Description: Apply overheatingCooldown using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: overheatingCooldown
  - Id: shieldCapacityBoost
    DisplayName: shieldCapacityBoost
    Description: Apply shieldCapacityBoost using its admission and stacking rules.
    Kind: ApplyBehaviour
    BehaviourId: shieldCapacityBoost
  - Id: disruptionArea
    DisplayName: disruptionArea
    Description: Apply disruption to hostile mechanical ships in the impact area.
    Kind: SearchArea
    TargetingId: hostileMechanicalArea
    EffectId: applyDisrupted
  - Id: disruptiveExplosion
    DisplayName: disruptiveExplosion
    Description: Deliver an EMP projectile; impact performs an area search.
    Kind: LaunchProjectile
    ProjectileId: empBall
    ImpactEffectId: disruptionArea
  - Id: infectionProjectile
    DisplayName: infectionProjectile
    Description: Deliver the same Infection application through a projectile.
    Kind: LaunchProjectile
    ProjectileId: infectionBolt
    ImpactEffectId: infection
